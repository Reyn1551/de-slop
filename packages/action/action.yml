name: de-slop
description: Anti AI-slop checks — slop scan, test-lock, package-gate
author: de-slop
branding:
  icon: shield
  color: red
inputs:
  command:
    description: Command to run (check | fix)
    default: check
  paths:
    description: Paths to scan
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Run de-slop
      shell: bash
      run: npx de-slop ${{ inputs.command }} ${{ inputs.paths }}
